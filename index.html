<script>
  const siteHeader = document.querySelector(".site-header");
  const hero = document.querySelector(".hero");
  const menuToggle = document.querySelector(".menu-toggle");
  const siteNav = document.querySelector(".site-nav");
  const menuBackdrop = document.querySelector(".menu-backdrop");
  const menuLinks = document.querySelectorAll(".site-nav a");

  function setMenuState(isOpen) {
    menuToggle.setAttribute("aria-expanded", String(isOpen));

    menuToggle.setAttribute(
      "aria-label",
      isOpen ? "Close navigation" : "Open navigation"
    );

    siteNav.classList.toggle("is-open", isOpen);
    menuBackdrop.classList.toggle("is-open", isOpen);
    document.body.classList.toggle("menu-open", isOpen);
  }

  function updateStickyHeader() {
    const isScrolled = window.scrollY > 24;

    /*
      The header becomes fully opaque once its lower edge
      has moved beyond the bottom edge of the hero image.
    */
    const hasPassedHero =
      hero.getBoundingClientRect().bottom <= siteHeader.offsetHeight;

    siteHeader.classList.toggle("is-scrolled", isScrolled);
    siteHeader.classList.toggle("past-hero", hasPassedHero);
  }

  menuToggle.addEventListener("click", () => {
    const isOpen =
      menuToggle.getAttribute("aria-expanded") === "true";

    setMenuState(!isOpen);
  });

  menuBackdrop.addEventListener("click", () => {
    setMenuState(false);
  });

  menuLinks.forEach((link) => {
    link.addEventListener("click", () => {
      setMenuState(false);
    });
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      setMenuState(false);
    }
  });

  window.addEventListener("resize", () => {
    if (window.innerWidth > 700) {
      setMenuState(false);
    }

    updateStickyHeader();
  });

  window.addEventListener("scroll", updateStickyHeader, {
    passive: true
  });

  window.addEventListener("load", updateStickyHeader);

  updateStickyHeader();
</script>
